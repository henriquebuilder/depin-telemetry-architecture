version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: depin-postgres
    environment:
      POSTGRES_DB: depin_network
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - depin-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: depin-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - depin-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  depin-network:
    driver: bridge
